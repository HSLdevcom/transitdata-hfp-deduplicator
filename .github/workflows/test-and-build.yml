name: Test and create Docker image

on: [push, pull_request]

jobs:
  build:
    uses: HSLdevcom/transitdata-shared-workflows/.github/workflows/ci-cd-java.yml@1.0.5
    secrets: inherit
    with:
      uploadJarArtifact: true
      jarArtifactName: "transitdata-hfp-deduplicator.jar"
      jarArtifactPath: "target/transitdata-hfp-deduplicator.jar"
      workingDirectory: .
      runTestsInsideDocker: true

  build-release-docker-image:
    needs: build
    runs-on: ubuntu-latest
    # Run only for tagged commits
    if: github.event_name == 'push' && contains(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v3
      - name: Download .jar file
        uses: actions/download-artifact@v4
        with:
          name: transitdata-hfp-deduplicator.jar
          path: target
      - name: Build and publish release Docker image
        uses: elgohr/Publish-Docker-Github-Action@v5
        with:
          name: hsldevcom/transitdata-hfp-deduplicator
          username: ${{ secrets.TRANSITDATA_DOCKERHUB_USER }}
          password: ${{ secrets.TRANSITDATA_DOCKERHUB_TOKEN }}
          tag_semver: true
  build-aks-dev-docker-image:
    needs: build
    runs-on: ubuntu-latest
    # Run only on aks-dev branch
    if: github.ref == 'refs/heads/aks-dev'
    steps:
      - uses: actions/checkout@v2
      - name: Download .jar file
        uses: actions/download-artifact@v4
        with:
          name: transitdata-hfp-deduplicator.jar
          path: target
      - name: Build and publish aks-dev Docker image
        uses: elgohr/Publish-Docker-Github-Action@master
        with:
          name: hsldevcom/transitdata-hfp-deduplicator
          username: ${{ secrets.TRANSITDATA_DOCKERHUB_USER }}
          password: ${{ secrets.TRANSITDATA_DOCKERHUB_TOKEN }}
          tags: aks-dev
