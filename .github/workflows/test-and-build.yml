name: Test and create Docker image

on: [push, pull_request]

jobs:
  build:
    uses: HSLdevcom/transitdata-shared-workflows/.github/workflows/ci-cd-java.yml@1.0.4
    secrets:
      DOCKER_USERNAME: ${{ secrets.TRANSITDATA_DOCKERHUB_USER }}
      DOCKER_PASSWORD: ${{ secrets.TRANSITDATA_DOCKERHUB_TOKEN }}
    with:
      uploadJarArtifact: true
      jarArtifactName: "transitdata-hfp-deduplicator.jar"
      jarArtifactPath: "target/transitdata-hfp-deduplicator.jar"
